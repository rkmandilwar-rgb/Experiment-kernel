# Stormbreaker — publish or refresh a pre-release from a finished build run.
#
# build.yml keeps its release job disabled (`if: false`) on purpose, so
# publishing is a separate, explicit step that never happens during a build.
# This workflow picks up a finished kernel artifact, adds the matching
# KernelSU-Next manager and either
#
#   - creates a pre-release for a new tag, or
#   - refreshes an existing pre-release in place (same tag, same release
#     page): the old kernel zip is replaced and the title/notes are rewritten,
#     nothing else is created.
#
# Start it by pushing a change to `.github/release-request` (it holds
# `run_id=` and `tag=`).  A push that does not touch that file never starts
# this workflow, and `workflow_dispatch` is kept for when a token with
# Actions: write is available.
#
# Nothing here runs for ordinary source pushes.

name: Publish pre-release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID to publish (for example 39568246521)'
        required: true
        type: string
      tag:
        description: 'Release tag (for example stormbreaker-168)'
        required: true
        type: string
  push:
    paths:
      - '.github/release-request'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-prerelease
  cancel-in-progress: false

jobs:
  publish:
    name: Publish pre-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the release request
        id: req
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
            tag="$INPUT_TAG"
          else
            run_id=$(sed -n 's/^run_id=//p' .github/release-request | head -n1)
            tag=$(sed -n 's/^tag=//p' .github/release-request | head -n1)
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo "::error::bad run_id '$run_id'"; exit 1 ;;
          esac
          case "$tag" in
            stormbreaker-*) ;;
            *) echo "::error::bad tag '$tag' (expected stormbreaker-<build>)"; exit 1 ;;
          esac
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "request: run ${run_id} -> ${tag}"

      - name: Resolve the build behind that run
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.req.outputs.run_id }}
          TAG: ${{ steps.req.outputs.tag }}
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}"

          sha=$(gh api "${api}/actions/runs/${RUN_ID}" --jq .head_sha)
          # artifact names look like "miatoll-kernel-175"
          artifact=$(gh api "${api}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[0].name')
          build=$(printf '%s' "$artifact" | sed -n 's/.*-\([0-9][0-9]*\)$/\1/p')

          test -n "$sha" || { echo "::error::could not resolve head_sha"; exit 1; }
          test -n "$artifact" || { echo "::error::no artifact on run ${RUN_ID}"; exit 1; }
          test -n "$build" || { echo "::error::cannot read a build number from '${artifact}'"; exit 1; }

          exists=false
          if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            exists=true
            echo "release ${TAG} exists: refreshing it in place"
          else
            # A brand new tag has to match the build it is created for.
            test "stormbreaker-${build}" = "$TAG" || {
              echo "::error::${TAG} does not match ${artifact} (expected stormbreaker-${build})"
              exit 1
            }
            echo "release ${TAG} does not exist: creating it"
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "resolved ${artifact} at ${sha}"

      - name: Download the kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.req.outputs.run_id }}
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" \
            -R "${{ github.repository }}" \
            -n "$ARTIFACT" \
            -D dist
          find dist -maxdepth 2 -type f | sort

      - name: Download the matching KernelSU-Next manager
        run: |
          set -euo pipefail
          # KernelSU-Next legacy v3.4.2, versionCode 33355 - the manager
          # version this kernel's driver reports.
          curl -fL --retry 3 --retry-delay 5 \
            -o dist/KernelSU_Next_v3.4.2_33355-release.apk \
            "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2_33355-release.apk"
          test -s dist/KernelSU_Next_v3.4.2_33355-release.apk

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.req.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD: ${{ steps.meta.outputs.build }}
          EXISTS: ${{ steps.meta.outputs.exists }}
        run: |
          set -euo pipefail

          zipf=$(find dist -name 'Stormbreaker-miatoll-*.zip' -print -quit)
          apk=$(find dist -name 'KernelSU_Next_*-release.apk' -print -quit)
          info=$(find dist -name 'build-info.txt' -print -quit)
          test -n "$zipf" || { echo "::error::no kernel zip in the artifact"; exit 1; }
          test -n "$apk"  || { echo "::error::no manager apk downloaded"; exit 1; }

          krel=""
          if [ -n "$info" ]; then
            krel=$(sed -n 's/^kernel\.release=//p' "$info" | head -n1)
          fi
          [ -n "$krel" ] || krel="4.14.357-openela"

          cat > notes.md <<EOF
          # Stormbreaker Kernel — miatoll

          **Pre-release — build ${BUILD} · \`${krel}\` · commit \`${SHA}\`**
          **Device:** Xiaomi Miatoll (Curtana / Gram / Joyeuse / Excalibur) — SM6250 (Atoll), non-GKI

          > **This kernel has not been booted on a device.** It is published as a
          > pre-release for testing only. Keep a bootable backup and a way to
          > restore your boot partition before flashing.

          ## Contents

          | File | What it is |
          |---|---|
          | \`$(basename "$zipf")\` | AnyKernel3 flashable zip — \`Image.gz\` + \`dtbo.img\` + base DTB, no modules |
          | \`$(basename "$apk")\` | KernelSU-Next manager v3.4.2, versionCode **33355** — matches the kernel |

          ## Flashing

          1. Boot TWRP (or any recovery that handles AnyKernel3).
          2. Flash \`$(basename "$zipf")\`.
          3. Reboot, then install the manager APK if it is not already present.

          ## KernelSU

          - KernelSU-Next **legacy v3.4.2**, versionCode **33355**, built in
            (\`CONFIG_KSU=y\`, manual hooks).
          - The manager APK is the upstream v3.4.2 build for this exact version
            code; it is included only so the pair can be flashed from one place.
          - Kernel-side source: \`KernelSU-Next/\` in this repository.

          ## What changed since the last build

          - SELinux hide / AVC spoofing audit: fops hooks are installed under a
            lock (a double patch could recurse into itself), the access reply is
            only rewritten for hidden queries, the fake status page is published
            with cmpxchg, and the AVC log spoof no longer rewrites the shared
            audit record.
          - SUSFS audit: \`clone_mnt()\` no longer inherits the fake-mnt-id tag
            (it leaked an ida slot per clone), the sdcard monitor drops its key
            on failure, the sus-path loop de-duplicates, readlink replies are
            terminated, the fake-name lookup cannot livelock, and getdents no
            longer does an inode lookup per entry for non-hidden processes.
          - NoMount audit: negative-dentry guard and payload flag validation.
          - fd wrapper (\`KSU_CMD_GET_WRAPPER_FD\`): private anon inode on 4.14
            instead of the shared global \`anon_inode_inode\`, and a real
            \`alloc_file_pseudo()\` backport so the wrapper matches upstream's
            \`<5.16\` code instead of a hand-rolled sequence.
          - SUSFS 2.3.0 and NoMount v21 earlier audit fixes: NUL-terminated
            pathname input, deferred \`dput()/path_put()\`, \`S_PRIVATE\` restore
            after a failed \`mmap\`, NUL-safe ioctl replies, no per-lookup log
            spam.
          - Thermal rework, conservative touch boost, WALT-first scheduling.
          - Full history: \`git log\` on \`arena/53729e17-experiment-kernel\`.

          ## Checksums

          \`\`\`
          $(cd dist && sha256sum "$(basename "$zipf")" "$(basename "$apk")")
          \`\`\`
          EOF

          if [ "$EXISTS" = "true" ]; then
            # Refresh in place: same release, same tag.  Replace the kernel zip
            # (its file name carries the build number, so --clobber alone would
            # leave the previous one behind) and keep a single manager apk.
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.assets[].name' | while read -r name; do
              case "$name" in
                Stormbreaker-miatoll-*.zip)
                  if [ "$name" != "$(basename "$zipf")" ]; then
                    echo "removing stale asset ${name}"
                    gh release delete-asset "$TAG" "$name" -R "$GITHUB_REPOSITORY" --yes
                  fi
                  ;;
              esac
            done
            gh release upload "$TAG" \
              -R "$GITHUB_REPOSITORY" \
              --clobber \
              "$zipf" "$apk"
            gh release edit "$TAG" \
              -R "$GITHUB_REPOSITORY" \
              --title "Stormbreaker Kernel miatoll — build ${BUILD} (pre-release)" \
              --notes-file notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              -R "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "Stormbreaker Kernel miatoll — build ${BUILD} (pre-release)" \
              --notes-file notes.md \
              --prerelease \
              "$zipf" "$apk"
          fi

          gh release view "$TAG" -R "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,tagName,assets \
            --jq '{url, tagName, isPrerelease, assets: [.assets[] | {name, size}]}'
