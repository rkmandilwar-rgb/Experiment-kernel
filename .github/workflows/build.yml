# Stormbreaker — build (miatoll)
# Non-GKI kernel v4.14.357 for Curtana / Gram / Joyeuse / Excalibur (SM6250/Atoll)
#
# Toolchain: pinned AOSP Clang r596125, fully LLVM (LLVM=1, LLVM_IAS=1,
# ld.lld).  Polly needs a toolchain that actually ships the pass, so the
# build uses the AOSP clang bundle instead of apt.llvm.org (whose packages
# do not include Polly) — the "Verify toolchain" step runs a Polly sanity
# check and fails early if the compiler cannot accept -mllvm -polly.
#
# Codegen: CONFIG_LLVM_POLLY + CONFIG_LTO_CLANG/THINLTO (--lto-O3 at link)
# + CONFIG_INLINE_OPTIMIZATION (see kernel/configs/miatoll/compiler.config).
#
# Feature/tuning packs (kernel/configs/miatoll/*.config, merged by
# scripts/merge-defconfig.sh): eBPF, NTFS(+ntfs3), EROFS, BBRv1, Droidspaces,
# NetHunter, haptics & sound, Bluetooth, Wi-Fi.
#
# This pipeline builds and uploads artifacts only.  The release job below is
# permanently disabled (`if: false`) on purpose: nothing is ever published to
# the repo's Releases page.

name: Build & Release Stormbreaker Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - a
      - 'arena/**'

permissions:
  contents: read

concurrency:
  group: miatoll-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig
  # Pinned AOSP clang (Polly-enabled); r596125 == LLVM 22.
  LLVM_VER: "r596125"
  # Mirror first (fast, reliable), then the AOSP host as fallback.
  CLANG_URL_MIRROR: https://github.com/jaymvictorino/clang-r596125-mirror/releases/download/v0.0.1/linux-x86-refs-heads-mirror-goog-main-llvm-toolchain-source-clang-r596125.tar.gz
  CLANG_URL_AOSP: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r596125.tar.gz

jobs:
  build:
    name: Compile and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Report runner resources
        run: |
          echo "::group::Runner"
          echo "cpus : $(nproc)"
          free -h
          df -h / | tail -1
          echo "::endgroup::"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache flex git kmod libelf-dev libc6-dev \
            make libssl-dev python3 rsync zstd zip curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi
          sudo apt-get install -y --no-install-recommends libtinfo5 || true

      - name: Fetch AOSP clang ${{ env.LLVM_VER }}
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/toolchains/clang-${LLVM_VER}"
          mkdir -p "$DEST"
          for url in "$CLANG_URL_MIRROR" "$CLANG_URL_AOSP"; do
            echo "==> trying $url"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o clang.tar.gz "$url"; then
              tar -xzf clang.tar.gz -C "$DEST" && rm -f clang.tar.gz && break
            fi
            rm -f clang.tar.gz
          done
          test -x "$DEST/bin/clang" || { echo "::error::could not fetch clang ${LLVM_VER}"; exit 1; }
          "$DEST/bin/clang" --version | head -3
          echo "$DEST/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain and Polly
        run: |
          set -euo pipefail
          echo "::group::Clang ${LLVM_VER} (AOSP)"
          clang --version
          echo "::endgroup::"
          echo "::group::LLVM tools"
          ld.lld --version
          llvm-ar --version | head -1
          llvm-nm --version | head -1
          llvm-objcopy --version | head -1
          echo "::endgroup::"
          echo "::group::Cross compilers (32-bit vDSO only)"
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1
          echo "::endgroup::"
          echo "::group::Polly sanity"
          echo 'int a(int n){int s=0;for(int i=0;i<n;i++)s+=i;return s;}' > /tmp/polly.c
          clang -O2 -mllvm -polly -c /tmp/polly.c -o /tmp/polly.o \
            || { echo "::error::toolchain has no Polly support"; exit 1; }
          echo "Polly accepted"
          echo "::endgroup::"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # Key on what actually changes the compiled output (toolchain +
          # defconfig + every fragment), not on the commit SHA, so consecutive
          # runs on different commits still reuse the cache.
          key: miatoll-ccache-${{ env.LLVM_VER }}-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/vendor/xiaomi/miatoll_defconfig', 'kernel/configs/miatoll/*.config', '.github/workflows/build.yml') }}
          restore-keys: |
            miatoll-ccache-${{ env.LLVM_VER }}-${{ runner.os }}-

      - name: Generate and verify configuration
        run: |
          set -euo pipefail

          DEFCONFIG_PATH="arch/arm64/configs/$DEFCONFIG"
          test -f "$DEFCONFIG_PATH"

          # ── Merge fragments into a temporary defconfig ──
          MERGED="arch/arm64/configs/vendor/xiaomi/stormbreaker_defconfig"
          cp "$DEFCONFIG_PATH" "$MERGED"
          scripts/merge-defconfig.sh "$MERGED"

          # ── Generate .config from merged defconfig ──
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/xiaomi/stormbreaker_defconfig

          # ── Module versioning off ──
          # Note what this really does: with MODVERSIONS=n the loader compares
          # the FULL vermagic string (release included), whereas MODVERSIONS=y
          # deliberately ignores the version part for modules that carry CRCs.
          # This kernel ships no modules at all, so CRC sections are pointless;
          # dropping them keeps the image smaller and makes it impossible for a
          # foreign .ko built for another release to half-load.
          scripts/config --file out/.config -d CONFIG_MODVERSIONS

          # ── Fill in dependencies silently ──
          make O=out ARCH=arm64 olddefconfig

          # ── Clean up temp defconfig ──
          rm -f "$MERGED"

          # ── Verify required features ──
          require() {
            grep -qx "$1" out/.config || {
              echo "::error::Required config missing: $1"
              exit 1
            }
          }
          require_off() {
            if grep -qE "^${1}=[ym]" out/.config; then
              echo "::error::Config must stay disabled: $1"
              exit 1
            fi
          }
          echo "::group::Config verification"

          # eBPF
          require 'CONFIG_BPF=y'
          require 'CONFIG_BPF_SYSCALL=y'
          require 'CONFIG_BPF_JIT=y'
          require 'CONFIG_CGROUP_BPF=y'
          require 'CONFIG_NET_CLS_BPF=y'
          require 'CONFIG_LWTUNNEL_BPF=y'

          # EROFS
          require 'CONFIG_EROFS_FS=y'
          require 'CONFIG_EROFS_FS_ZIP=y'

          # NTFS
          require 'CONFIG_NTFS_FS=y'
          require 'CONFIG_NTFS_RW=y'

          # BBR (v1) as the default congestion control, fq pacing
          require 'CONFIG_TCP_CONG_BBR=y'
          require 'CONFIG_DEFAULT_TCP_CONG="bbr"'
          require 'CONFIG_NET_SCH_FQ=y'

          # Droidspaces / namespaces
          require 'CONFIG_SYSVIPC=y'
          require 'CONFIG_POSIX_MQUEUE=y'
          require 'CONFIG_NAMESPACES=y'
          require 'CONFIG_PID_NS=y'
          require 'CONFIG_UTS_NS=y'
          require 'CONFIG_IPC_NS=y'
          require 'CONFIG_NET_NS=y'
          require 'CONFIG_USER_NS=y'
          require 'CONFIG_SECCOMP=y'
          require 'CONFIG_SECCOMP_FILTER=y'
          require 'CONFIG_CGROUP_DEVICE=y'
          require 'CONFIG_CGROUP_PIDS=y'
          require 'CONFIG_CGROUP_FREEZER=y'
          require 'CONFIG_CGROUP_NET_PRIO=y'
          require 'CONFIG_CGROUP_CPUACCT=y'
          require 'CONFIG_DEVTMPFS=y'
          require 'CONFIG_OVERLAY_FS=y'
          require 'CONFIG_VETH=y'
          require 'CONFIG_BRIDGE=y'
          require 'CONFIG_BRIDGE_NETFILTER=y'
          require 'CONFIG_NF_CONNTRACK=y'
          require 'CONFIG_NF_NAT=y'
          require 'CONFIG_NF_TABLES=y'
          require 'CONFIG_NF_NAT_IPV4=y'
          require 'CONFIG_IP_NF_NAT=y'
          require 'CONFIG_IP_NF_TARGET_MASQUERADE=y'
          require 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y'
          require 'CONFIG_IP6_NF_NAT=y'
          require 'CONFIG_IP6_NF_TARGET_MASQUERADE=y'
          require 'CONFIG_IP_SET=y'
          # Droidspaces --cpus cannot work here (CFS_BANDWIDTH depends on
          # !SCHED_WALT): assert that we did NOT pretend otherwise.
          require_off 'CONFIG_CFS_BANDWIDTH'

          # NetHunter
          require 'CONFIG_USB_ACM=y'
          require 'CONFIG_USB_GADGET=y'
          require 'CONFIG_USB_CONFIGFS=y'
          require 'CONFIG_USB_CONFIGFS_F_HID=y'
          require 'CONFIG_USB_CONFIGFS_MASS_STORAGE=y'
          require 'CONFIG_USB_MON=y'
          require 'CONFIG_CAN=y'
          require 'CONFIG_CAN_RAW=y'
          require 'CONFIG_CAN_VCAN=y'
          # slcan must be built in, not a module: no .ko is shipped
          require 'CONFIG_CAN_SLCAN=y'
          require 'CONFIG_NFSD=y'
          require 'CONFIG_CFG80211=y'
          require 'CONFIG_MAC80211=y'
          require 'CONFIG_ATH9K_HTC=y'
          require 'CONFIG_CARL9170=y'
          require 'CONFIG_BT=y'
          require 'CONFIG_BT_RFCOMM=y'
          require 'CONFIG_HIDRAW=y'
          require 'CONFIG_UHID=y'

          # In-kernel performance/memory tuning
          require 'CONFIG_HZ_300=y'
          require 'CONFIG_KSM=y'
          require 'CONFIG_TRANSPARENT_HUGEPAGE=y'
          require 'CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y'
          require 'CONFIG_HUGETLBFS=y'
          require 'CONFIG_IOSCHED_BFQ=y'
          require 'CONFIG_BFQ_GROUP_IOSCHED=y'
          require 'CONFIG_ZSWAP=y'
          require 'CONFIG_FRONTSWAP=y'
          require 'CONFIG_ZBUD=y'
          require 'CONFIG_ZRAM_DEDUP=y'
          require 'CONFIG_LZ4HC_COMPRESS=y'
          require 'CONFIG_CRYPTO_LZ4HC=y'
          require 'CONFIG_SND_HRTIMER=y'

          # Compiler/codegen pack (Polly + Clang LTO + inlining)
          require 'CONFIG_LLVM_POLLY=y'
          require 'CONFIG_LTO_CLANG=y'
          require 'CONFIG_THINLTO=y'
          require 'CONFIG_INLINE_OPTIMIZATION=y'
          grep -q -- '-mllvm -polly' Makefile \
            || { echo "::error::Polly build flags missing from Makefile"; exit 1; }
          grep -q 'config LLVM_POLLY' arch/Kconfig \
            || { echo "::error::LLVM_POLLY Kconfig option missing"; exit 1; }
          grep -q 'config INLINE_OPTIMIZATION' init/Kconfig \
            || { echo "::error::INLINE_OPTIMIZATION Kconfig option missing"; exit 1; }

          # Kinesis ports: uname spoof, BPF helper, CASS, TEO, LZ4KD, ramdisk
          require 'CONFIG_FAKE_UNAME_5_10=y'
          require 'CONFIG_SCHED_CASS=y'
          require 'CONFIG_CPU_IDLE_GOV_TEO=y'
          require 'CONFIG_RD_XZ=y'
          require 'CONFIG_RD_LZO=y'
          require 'CONFIG_RD_LZ4=y'
          require 'CONFIG_CRYPTO_LZ4KD=y'
          require 'CONFIG_LZ4KD_COMPRESS=y'
          require 'CONFIG_LZ4KD_DECOMPRESS=y'
          require 'CONFIG_KERNEL_MODE_NEON=y'
          grep -q 'bpf_trace_printk_dummy' kernel/bpf/core.c \
            || { echo "::error::dummy bpf_trace_printk helper missing"; exit 1; }
          grep -q 'cass_select_task_rq_fair' kernel/sched/cass.c \
            || { echo "::error::CASS scheduler source missing"; exit 1; }
          grep -q 'FAKE_UNAME_5_10' kernel/sys.c \
            || { echo "::error::uname spoof for the BPF loaders missing"; exit 1; }

          # Kinesis parity options: suspend path, tethering/TTL helpers, the
          # Android quota2 logger, the HMARK marker and msdos FAT tooling.
          require 'CONFIG_SUSPEND_SKIP_SYNC=y'
          require 'CONFIG_NETFILTER_XT_TARGET_HMARK=y'
          require 'CONFIG_NETFILTER_XT_MATCH_QUOTA2_LOG=y'
          require 'CONFIG_IP_NF_TARGET_TTL=y'
          require 'CONFIG_IP6_NF_TARGET_HL=y'
          require 'CONFIG_MSDOS_FS=y'
          # EROFS: the fragment enables the filesystem; these make sure the
          # compressed (LZ4) reader that came with the port is really in.
          require 'CONFIG_EROFS_FS=y'
          require 'CONFIG_EROFS_FS_ZIP=y'
          require 'CONFIG_LZ4_DECOMPRESS=y'

          # Haptics & sound pack
          require 'CONFIG_SND_PCM_TIMER=y'
          require 'CONFIG_SND_DYNAMIC_MINORS=y'
          require 'CONFIG_SND_COMPRESS_OFFLOAD=y'
          require 'CONFIG_SND_SOC_COMPRESS=y'
          require 'CONFIG_SND_USB_AUDIO=y'
          require 'CONFIG_INPUT_FF_MEMLESS=y'
          require 'CONFIG_AW8624_HAPTIC=y'
          require 'CONFIG_DRV2624_HAPTIC=y'
          grep -q 'WQ_HIGHPRI' drivers/misc/aw8624_haptic/aw8624.c \
            || { echo "::error::AW8624 vibrator workqueue is not high-priority"; exit 1; }
          grep -q 'static ssize_t aw8624_ulevel_store' drivers/misc/aw8624_haptic/aw8624.c \
            || { echo "::error::AW8624 ulevel control missing"; exit 1; }
          grep -q 'if (val > 128)' drivers/misc/aw8624_haptic/aw8624.c \
            || { echo "::error::AW8624 ulevel range check missing"; exit 1; }

          # Bluetooth tuning: internal WCN3990 goes through hci_qca
          require 'CONFIG_BT_HCIUART=y'
          require 'CONFIG_BT_HCIUART_H4=y'
          require 'CONFIG_BT_HCIUART_QCA=y'
          require 'CONFIG_BT_HIDP=y'
          require 'CONFIG_BT_BNEP=y'
          require 'CONFIG_BT_RFCOMM_TTY=y'
          require 'CONFIG_BT_HCIVHCI=y'
          require 'CONFIG_BT_HCIBTUSB_BCM=y'
          require 'CONFIG_BT_HCIBTUSB_RTL=y'
          require 'CONFIG_BT_BNEP_PROTO_FILTER=y'

          # Wi-Fi tuning
          require 'CONFIG_CFG80211_INTERNAL_REGDB=y'
          require 'CONFIG_NL80211_TESTMODE=y'
          require 'CONFIG_CFG80211_WEXT=y'
          require 'CONFIG_MAC80211_RC_DEFAULT="minstrel_ht"'
          require 'CONFIG_MAC80211_MESH=y'
          require 'CONFIG_QCA_CLD_WLAN=y'

          # Module-free build: nothing may be left as a module
          if grep -q '=m$' out/.config; then
            echo "::error::Modules are enabled but the pipeline never builds/ships them:"
            grep '=m$' out/.config
            exit 1
          fi

          # cgroup NOPREFIX compatibility links must use the legacy prefix
          grep -q 'cgroup_compat_link_name' kernel/cgroup/cgroup.c \
            || { echo "::error::cgroup NOPREFIX compat link helper missing"; exit 1; }

          echo "::endgroup::"
          echo "::group::Config stats"
          echo "  =y  : $(grep -c '=y' out/.config)"
          echo "  =m  : $(grep -c '=m' out/.config)"
          echo "::endgroup::"

      - name: Check config fragments against the generated config
        run: |
          set -o pipefail
          bash scripts/check-config-fragments.sh out/.config 2>&1 | tee fragment-check.log

      - name: Build kernel, DTB and DTBO
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=stormbreaker
          export KBUILD_BUILD_HOST=kernel-ci
          # GitHub caps the whole cache at 10 GB per repo — keep ccache well
          # below that so the cache entry can actually be saved/restored.
          ccache --max-size=5G

          # Kernel 4.14 predates this toolchain; disable -Werror to tolerate
          # warnings that the newer clang now flags.
          # -k (keep going) so a broken file does not hide the errors behind it.
          set +e
          make -k -j"$(nproc)" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC='ccache clang' HOSTCC='ccache clang' \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf STRIP=llvm-strip \
            HOSTLD=ld.lld HOSTAR=llvm-ar \
            KCFLAGS="-Wno-error" \
            > build.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            grep -E ' error:|fatal error:|Error [0-9]+|Killed' build.log | sed 's/\r$//' | awk '!seen[$0]++' \
              | cut -c1-200 > build-errors.txt || true
            total=$(wc -l < build-errors.txt)
            # If the pattern matched nothing, surface the tail so a failure is
            # never reported as "0 distinct errors".
            if [ "$total" -eq 0 ]; then
              tail -30 build.log | sed 's/\r$//' | cut -c1-200 > build-errors.txt || true
              total=$(wc -l < build-errors.txt)
            fi
            # Emit each error as a GitHub annotation (visible in API)
            while IFS= read -r line; do
              echo "::error::$line"
            done < build-errors.txt
            echo "## Build failure" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**${total} distinct error lines**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -200 build-errors.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Last 200 lines of build.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Kernel build failed (${total} distinct errors). See summary."
            exit "$status"
          fi

          tail -n 60 build.log

      - name: Verify build products
        run: |
          set -euo pipefail
          check_file() {
            test -s "$1" || { echo "::error::Missing: $1"; exit 1; }
            echo "ok: $1"
          }
          check_file out/arch/arm64/boot/Image.gz
          check_file out/arch/arm64/boot/dtbo.img
          check_file out/arch/arm64/boot/dts/qcom/cust-atoll-ab.dtb

          echo "::group::SHA256"
          sha256sum out/arch/arm64/boot/Image.gz
          sha256sum out/arch/arm64/boot/dtbo.img
          sha256sum out/arch/arm64/boot/dts/qcom/cust-atoll-ab.dtb
          echo "::endgroup::"

          make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- kernelrelease \
            | tee kernel.release

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-build-failure-${{ github.run_number }}
          path: |
            build.log
            build-errors.txt
            fragment-check.log
            out/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: Package AnyKernel3 flashable zip
        run: |
          set -euo pipefail
          bash scripts/package-anykernel3.sh 2>&1 | tee package.log

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

  release:
    name: Publish release
    needs: build
    # Kept permanently disabled: this pipeline builds and uploads the artifact
    # only.  Flip to `if: true` (or delete this line) deliberately if a GitHub
    # release is ever wanted.
    if: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="stormbreaker-${{ github.run_number }}"

          KREL=$(grep kernel.release release-assets/build-info.txt \
                 | cut -d= -f2 || echo "unknown")

          cat > release-notes.md << EOF
          # Stormbreaker Kernel — miatoll

          **Kernel:** \`${KREL}\`
          **Device:** Xiaomi Miatoll (Curtana / Gram / Joyeuse / Excalibur)
          **SoC:** SM6250 (Atoll) — non-GKI kernel v4.14
          **Toolchain:** AOSP Clang \`${LLVM_VER}\` with Polly + ThinLTO (LLVM/LLD)

          ---

          ## ✨ Features

          ### Codegen
          - Polly polyhedral loop optimizer, Clang ThinLTO, aggressive inlining
          - Built with ld.lld (LLVM_IAS integrated assembler)

          ### eBPF (extended Berkeley Packet Filter)
          - \`BPF_SYSCALL=y\` — BPF syscall + arm64 JIT (\`BPF_JIT_ALWAYS_ON\`)
          - cgroup-bpf, kprobe / uprobe / tracepoint attach types
          - cls_bpf, act_bpf, lwtunnel BPF, \`NETFILTER_XT_MATCH_BPF\`
          - BPF stream parser (sockmap / sk_msg), BPF events

          ### NTFS support
          - **Legacy NTFS** (\`NTFS_FS=y\`, \`NTFS_RW=y\`) — read + partial write
          - **Paragon NTFS3** read-write driver (backported to 4.14)
            - Normal / sparse / compressed files, journal replaying
            - POSIX ACLs, LZX / XPRESS decompression
            - Coexists with legacy driver: \`mount -t ntfs3\`

          ### EROFS (Enhanced Read-Only File System)
          - \`EROFS_FS=y\` with LZ4 compression, xattrs, ACLs, security labels

          ### BBRv1 congestion control
          - BBR v1 as default TCP congestion control (\`DEFAULT_TCP_CONG="bbr"\`)
          - fq pacing qdisc (\`NET_SCH_FQ=y\`)

          ### Haptics, Bluetooth, Wi-Fi tuning
          - **Haptics:** AW8624 vibrator workqueue runs at high priority (buzz
            onset is not queued behind ordinary work); \`ulevel\` sysfs ceiling
            (0..128) for userspace strength control; DRV2624 fallback;
            force-feedback input layer; ALSA hrtimer + compress offload
          - **Bluetooth:** QCA UART protocol (\`hci_qca\`) for the internal
            WCN3990 — in-band sleep / UART clock control; virtual HCI for
            btmon/btsnoop; BNEP filters for tethering; btusb BCM/RTL
          - **Wi-Fi:** in-kernel regulatory database (no CRDA on Android),
            NL80211 testmode (monitor/injection tooling), minstrel_ht rate
            control, mesh; Qualcomm CLD stack + CNSS netlink

          ### Droidspaces (Linux containers on Android)
          - Full namespace isolation: PID, UTS, IPC, NET, USER
          - cgroup controllers: device, sched, freezer, net_prio, cpuacct,
            pids, memory (**no CFS bandwidth — see the note below**)
          - seccomp + seccomp filter, devtmpfs, overlayfs (volatile mode)
          - Full netfilter stack: conntrack, NAT, nftables, bridge netfilter,
            VETH, IPv6 NAT (NAT66)
          - Prefixed cgroup control files published as links for v1 mounts
            that use the \`noprefix\` option (blkio/memory/cpu spellings)
          - **Known limitation:** \`--cpus\` quotas need \`CONFIG_CFS_BANDWIDTH\`,
            which this tree cannot enable while Qualcomm WALT is on. Memory and
            PID limits work.

          ### Kali NetHunter support
          - **USB Gadget (configfs):** HID (BadUSB), CDC ACM, ECM, NCM, RNDIS,
            Mass Storage, EEM
          - **USB traffic monitoring:** \`USB_MON=y\`
          - **CAN bus:** vcan, slcan (built-in), all USB CAN adaptors
          - **Bluetooth Arsenal:** RFCOMM TTY, BNEP, HIDP
          - **NFS server + client:** v2 / v3 / v4
          - **mac80211 + external USB Wi-Fi:** ath9k_htc, carl9170, rt2x00,
            mt7601u, rtl8187, rtl8xxxu, zd1211rw
          - **USB serial:** CH341, FTDI, PL2303, CP210X
          - **SDR:** DVB RTL28XXU

          ### Security fixes
          - **CVE-2025-39764** — netfilter ctnetlink expectation dumpers use a
            cookie (expect id) instead of a pointer+refcount, so the dump
            resumption path can no longer double-increment a reference

