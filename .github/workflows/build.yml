# Stormbreaker — build & release (miatoll)
# Non-GKI kernel v4.14.357 for Curtana / Gram / Joyeuse / Excalibur
# Built with LLVM 22 from apt.llvm.org (official), no GCC for aarch64.
#
# Root/hiding stack baked in:
#   - KernelSU (backslashxx fork) v3.3.0+72 — drivers/kernelsu, manual hooks
#     (issue #5 rev v2.3) + LSM security hooks
#   - SUSFS v2.3.0 — non-GKI 4.14 semantic port (fs/susfs.c + fs hooks),
#     userspace ABI bridged over the KernelSU reboot supercall
#   - NoMount v2.1.0 — fs/nomount VFS path redirection (+ post-release
#     evict_inode fix 7e7342cd4)
#   - Companion module zips attached to every build: BRENE (SUSFS control
#     panel) and the NoMount metamodule
#   - Smooth-tuning pack baked into the kernel (no modules): touch-boost,
#     schedutil/WALT defaults, GPU boot pwrlevel, KSM/THP/ZSWAP-lz4,
#     zram page-cluster 0, CFQ default + 256KB read-ahead
#   - Haptics & sound: AW8624 high-priority vibrator workqueue, ALSA
#     hrtimer backend, compress offload, USB audio, FF-memless
name: Build & Release Stormbreaker Kernel

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to build on (larger runners need a paid plan / org)'
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-latest-8-cores
          - ubuntu-latest-16-cores
          - ubuntu-latest-32-cores
          - ubuntu-latest-64-cores
  push:
    branches:
      - arena/7e8eb3ac-experiment-kernel

permissions:
  contents: write

concurrency:
  group: miatoll-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig
  LLVM_VERSION: "22"
  # Companion userspace modules bundled with every kernel build
  BRENE_REPO: rrr333nnn333/BRENE
  BRENE_TAG: v0.0.70
  BRENE_ASSET: BRENE-v0.0.70.zip
  NOMOUNT_REPO: maxsteeel/nomount
  NOMOUNT_TAG: v2.1.0
  NOMOUNT_ASSET: NoMount-v2.1.0-release-500.zip

jobs:
  build:
    name: Compile and verify
    # ubuntu-24.04 = biggest free GitHub-hosted runner for public repos
    # (4 vCPU / 16 GB RAM / 175 GB SSD). Pick a larger runner via
    # workflow_dispatch when the repo has access to paid larger runners;
    # everything below scales with nproc automatically.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 240

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Report runner resources
        run: |
          echo "::group::Runner"
          echo "label    : ${{ inputs.runner || 'ubuntu-24.04' }}"
          echo "cpus     : $(nproc)"
          lscpu | grep -E 'Model name|Socket|Core|Thread' || true
          free -h
          df -h /mnt /  2>/dev/null | tail -2
          echo "::endgroup::"

      - name: Install LLVM 22 + build dependencies
        run: |
          # ── LLVM 22 from apt.llvm.org (official stable) ──
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] \
            http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list

          sudo apt-get update
          sudo apt-get install -y \
            clang-${LLVM_VERSION} lld-${LLVM_VERSION} \
            llvm-${LLVM_VERSION} \
            bc bison ccache flex git kmod libelf-dev libc6-dev \
            make libssl-dev python3 rsync zstd zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

          # ── Remove system clang to avoid conflicts with LLVM 22 ──
          sudo apt-get remove -y clang clang-18 lld lld-18 2>/dev/null || true

          # ── Create unversioned symlinks so the Makefile finds clang, ld.lld, etc. ──
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${LLVM_VERSION} 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-${LLVM_VERSION} 100
          for tool in ar nm objcopy objdump readelf strip; do
            sudo update-alternatives --install /usr/bin/llvm-${tool} llvm-${tool} /usr/bin/llvm-${tool}-${LLVM_VERSION} 100
          done

      - name: Verify toolchain
        run: |
          echo "::group::Clang ${LLVM_VERSION}"
          clang --version
          echo "::endgroup::"
          echo "::group::LLVM tools"
          ld.lld --version
          llvm-ar --version | head -1
          llvm-nm --version | head -1
          llvm-objcopy --version | head -1
          echo "::endgroup::"
          echo "::group::Cross compilers"
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1
          echo "::endgroup::"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: miatoll-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            miatoll-ccache-${{ runner.os }}-

      - name: Generate and verify configuration
        run: |
          set -euo pipefail

          DEFCONFIG_PATH="arch/arm64/configs/$DEFCONFIG"
          test -f "$DEFCONFIG_PATH"

          # ── Merge fragments into a temporary defconfig ──
          MERGED="arch/arm64/configs/vendor/xiaomi/stormbreaker_defconfig"
          cp "$DEFCONFIG_PATH" "$MERGED"
          scripts/merge-defconfig.sh "$MERGED"

          # ── Generate .config from merged defconfig ──
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            vendor/xiaomi/stormbreaker_defconfig

          # ── Disable modversions (clang-built CRC drift) ──
          scripts/config --file out/.config -d CONFIG_MODVERSIONS

          # ── Fill in dependencies silently ──
          make O=out ARCH=arm64 olddefconfig

          # ── Clean up temp defconfig ──
          rm -f "$MERGED"

          # ── Verify required features ──
          require() {
            grep -qx "$1" out/.config || {
              echo "::error::Required config missing: $1"
              exit 1
            }
          }
          require_off() {
            if grep -q "^${1}=y" out/.config; then
              echo "::error::Config must stay disabled: $1"
              exit 1
            fi
          }
          echo "::group::Config verification"

          # eBPF
          require 'CONFIG_BPF=y'
          require 'CONFIG_BPF_SYSCALL=y'
          require 'CONFIG_BPF_JIT=y'
          require 'CONFIG_CGROUP_BPF=y'
          require 'CONFIG_NET_CLS_BPF=y'
          require 'CONFIG_LWTUNNEL_BPF=y'

          # EROFS
          require 'CONFIG_EROFS_FS=y'
          require 'CONFIG_EROFS_FS_ZIP=y'

          # NTFS
          require 'CONFIG_NTFS_FS=y'
          require 'CONFIG_NTFS_RW=y'

          # BBR
          require 'CONFIG_TCP_CONG_BBR=y'

          # Droidspaces / namespaces
          require 'CONFIG_SYSVIPC=y'
          require 'CONFIG_POSIX_MQUEUE=y'
          require 'CONFIG_NAMESPACES=y'
          require 'CONFIG_PID_NS=y'
          require 'CONFIG_UTS_NS=y'
          require 'CONFIG_IPC_NS=y'
          require 'CONFIG_NET_NS=y'
          require 'CONFIG_USER_NS=y'
          require 'CONFIG_SECCOMP=y'
          require 'CONFIG_SECCOMP_FILTER=y'
          require 'CONFIG_CGROUP_DEVICE=y'
          require 'CONFIG_CGROUP_PIDS=y'
          require 'CONFIG_CGROUP_FREEZER=y'
          require 'CONFIG_CGROUP_NET_PRIO=y'
          require 'CONFIG_CGROUP_CPUACCT=y'
          require 'CONFIG_DEVTMPFS=y'
          require 'CONFIG_OVERLAY_FS=y'
          require 'CONFIG_VETH=y'
          require 'CONFIG_BRIDGE=y'
          require 'CONFIG_BRIDGE_NETFILTER=y'
          require 'CONFIG_NF_CONNTRACK=y'
          require 'CONFIG_NF_NAT=y'
          require 'CONFIG_NF_TABLES=y'
          require 'CONFIG_NF_NAT_IPV4=y'
          require 'CONFIG_IP_NF_NAT=y'
          require 'CONFIG_IP_NF_TARGET_MASQUERADE=y'
          require 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y'
          require 'CONFIG_IP6_NF_NAT=y'
          require 'CONFIG_IP6_NF_TARGET_MASQUERADE=y'
          require 'CONFIG_IP_SET=y'

          # NetHunter
          require 'CONFIG_USB_ACM=y'
          require 'CONFIG_USB_GADGET=y'
          require 'CONFIG_USB_CONFIGFS=y'
          require 'CONFIG_USB_CONFIGFS_F_HID=y'
          require 'CONFIG_USB_CONFIGFS_MASS_STORAGE=y'
          require 'CONFIG_USB_MON=y'
          require 'CONFIG_CAN=y'
          require 'CONFIG_CAN_RAW=y'
          require 'CONFIG_CAN_VCAN=y'
          require 'CONFIG_NFSD=y'
          require 'CONFIG_CFG80211=y'
          require 'CONFIG_MAC80211=y'
          require 'CONFIG_ATH9K_HTC=y'
          require 'CONFIG_CARL9170=y'
          require 'CONFIG_BT=y'
          require 'CONFIG_BT_RFCOMM=y'
          require 'CONFIG_HIDRAW=y'
          require 'CONFIG_UHID=y'

          # KernelSU (backslashxx v3.3.0+72)
          require 'CONFIG_KSU=y'
          require 'CONFIG_KSU_LSM_SECURITY_HOOKS=y'
          require 'CONFIG_KSU_HEURISTIC_IN_TREE_BUILD=y'
          require_off 'CONFIG_KSU_KPROBES_KSUD'
          require_off 'CONFIG_KSU_TAMPER_SYSCALL_TABLE'
          require_off 'CONFIG_KSU_HACK_ARM64_BRANCH_LINK'

          # SUSFS v2.3.0 (non-GKI 4.14 port, supercall-bridged)
          require 'CONFIG_KSU_SUSFS=y'
          require 'CONFIG_KSU_SUSFS_SUS_PATH=y'
          require 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
          require 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
          require 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
          require 'CONFIG_KSU_SUSFS_ENABLE_LOG=y'
          require 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
          require 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
          require 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
          require 'CONFIG_KSU_SUSFS_SUS_MAP=y'
          require 'CONFIG_FUSE_FS=y'   # KSU_SUSFS hard dependency

          # NoMount v2.1.0
          require 'CONFIG_NOMOUNT=y'

          # Smooth-tuning pack: memory features
          require 'CONFIG_KSM=y'
          require 'CONFIG_TRANSPARENT_HUGEPAGE=y'
          require 'CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y'
          require 'CONFIG_FRONTSWAP=y'
          require 'CONFIG_ZSWAP=y'
          require 'CONFIG_ZPOOL=y'
          require 'CONFIG_ZBUD=y'
          require 'CONFIG_IDLE_PAGE_TRACKING=y'
          require 'CONFIG_PAGE_EXTENSION=y'

          # Smooth-tuning pack: CFQ default for legacy queues
          # (UFS is blk-mq and auto-falls back to mq-deadline in
          #  block/elevator.c; BFQ cannot attach to blk-mq on 4.14)
          require 'CONFIG_IOSCHED_CFQ=y'
          require 'CONFIG_DEFAULT_CFQ=y'
          require 'CONFIG_DEFAULT_IOSCHED="cfq"'
          require 'CONFIG_MQ_IOSCHED_DEADLINE=y'

          # Smooth-tuning pack: baked-in defaults (source contract)
          grep -q 'input_boost_ms = 120' drivers/cpufreq/cpu-boost.c \
            || { echo "::error::touch-boost duration default missing"; exit 1; }
          grep -q '1708800 : 1401600' drivers/cpufreq/cpu-boost.c \
            || { echo "::error::touch-boost freq defaults missing"; exit 1; }
          grep -q 'page_cluster = 0' mm/swap.c \
            || { echo "::error::zram page-cluster default missing"; exit 1; }
          grep -q '1127' kernel/sched/fair.c \
            || { echo "::error::WALT capacity-margin default missing"; exit 1; }
          grep -q 'tunables->up_rate_limit_us = 500' kernel/sched/cpufreq_schedutil.c \
            || { echo "::error::schedutil up-rate default missing"; exit 1; }
          grep -qE 'VM_MAX_READAHEAD[[:space:]]+256' include/linux/mm.h \
            || { echo "::error::256KB read-ahead default missing"; exit 1; }
          grep -q 'ZSWAP_COMPRESSOR_DEFAULT "lz4"' mm/zswap.c \
            || { echo "::error::zswap lz4 default missing"; exit 1; }
          if grep -q 'qcom,initial-pwrlevel = <6>' arch/arm64/boot/dts/qcom/atoll.dtsi; then
            echo "::error::GPU still boots at lowest power level"
            exit 1
          fi

          # Haptics & sound pack
          require 'CONFIG_SND_HRTIMER=y'
          require 'CONFIG_SND_PCM_TIMER=y'
          require 'CONFIG_SND_DYNAMIC_MINORS=y'
          require 'CONFIG_SND_COMPRESS_OFFLOAD=y'
          require 'CONFIG_SND_SOC_COMPRESS=y'
          require 'CONFIG_SND_USB_AUDIO=y'
          require 'CONFIG_INPUT_FF_MEMLESS=y'
          require 'CONFIG_AW8624_HAPTIC=y'
          require 'CONFIG_DRV2624_HAPTIC=y'
          grep -q 'WQ_HIGHPRI' drivers/misc/aw8624_haptic/aw8624.c \
            || { echo "::error::AW8624 haptic workqueue not high-priority"; exit 1; }

          # ── Source-level version contract ──
          grep -q 'SUSFS_VERSION "v2.3.0"' include/linux/susfs.h \
            || { echo "::error::SUSFS is not v2.3.0"; exit 1; }
          grep -q 'KSU_VERSION=32673' drivers/kernelsu/Makefile \
            || { echo "::error::KernelSU is not v3.3.0+72 (32673)"; exit 1; }
          grep -q 'NOMOUNT_BASE_VERSION "21"' fs/nomount/nomount.h \
            || { echo "::error::NoMount is not the v2.1.0 line"; exit 1; }
          # SUSFS userspace ABI must be bridged into the KSU supercall
          grep -q 'SUSFS_MAGIC' drivers/kernelsu/supercall/supercall.c \
            || { echo "::error::KSU<->SUSFS supercall bridge missing"; exit 1; }
          grep -q 'susfs_is_current_ksu_domain' drivers/kernelsu/selinux/selinux.c \
            || { echo "::error::KSU selinux SUSFS glue missing"; exit 1; }
          grep -q 'susfs_init();' drivers/kernelsu/ksu.c \
            || { echo "::error::KSU susfs_init glue missing"; exit 1; }

          echo "::endgroup::"
          echo "::group::Config stats"
          echo "  =y  : $(grep -c '=y' out/.config)"
          echo "  =m  : $(grep -c '=m' out/.config)"
          echo "::endgroup::"

      - name: Build kernel, DTB and DTBO
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=stormbreaker
          export KBUILD_BUILD_HOST=kernel-ci
          ccache --max-size=25G

          # Kernel 4.14 predates Clang 22; disable -Werror to tolerate
          # warnings that the newer toolchain now flags.
          set +e
          make -j"$(nproc)" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC='ccache clang-22' HOSTCC='ccache clang-22' \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            > build.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            grep -E ' error:|fatal error:' build.log | sed 's/\r$//' | awk '!seen[$0]++' \
              | cut -c1-200 > build-errors.txt || true
            total=$(wc -l < build-errors.txt)
            # Emit each error as a GitHub annotation (visible in API)
            while IFS= read -r line; do
              echo "::error::$line"
            done < build-errors.txt
            echo "## Build failure" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**${total} distinct error lines**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -50 build-errors.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Last 200 lines of build.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Kernel build failed (${total} distinct errors). See summary."
            exit "$status"
          fi

          tail -n 60 build.log

      - name: Verify build products
        run: |
          set -euo pipefail
          check_file() {
            test -s "$1" || { echo "::error::Missing: $1"; exit 1; }
            echo "ok: $1"
          }
          check_file out/arch/arm64/boot/Image.gz
          check_file out/arch/arm64/boot/dtbo.img
          check_file out/arch/arm64/boot/dts/qcom/cust-atoll-ab.dtb

          echo "::group::SHA256"
          sha256sum out/arch/arm64/boot/Image.gz
          sha256sum out/arch/arm64/boot/dtbo.img
          sha256sum out/arch/arm64/boot/dts/qcom/cust-atoll-ab.dtb
          echo "::endgroup::"

          make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- kernelrelease \
            | tee kernel.release

          {
            echo "commit=${GITHUB_SHA}"
            echo "kernel.release=$(cat kernel.release)"
            echo "toolchain=llvm-${LLVM_VERSION}"
            clang --version | head -1 | sed 's/^/clang.version=/'
            ld.lld --version | head -1 | sed 's/^/lld.version=/'
          } > build-info.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-build-failure-${{ github.run_number }}
          path: |
            build.log
            build-errors.txt
            out/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: Package AnyKernel3 flashable zip
        run: |
          set -euo pipefail
          bash scripts/package-anykernel3.sh 2>&1 | tee package.log

      - name: Attach companion modules (BRENE + NoMount metamodule)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Userspace companions for the baked-in kernel features:
          #  - BRENE: SUSFS control panel + ksu_susfs tool (talks to this
          #    kernel's SUSFS v2.3.0 over the KSU reboot supercall)
          #  - NoMount metamodule: activates the built-in fs/nomount
          fetch_asset() {
            local repo="$1" tag="$2" asset="$3"
            for attempt in 1 2 3; do
              if gh release download "$tag" -R "$repo" -p "$asset" \
                   -D artifacts --clobber; then
                if [ -s "artifacts/$asset" ] && head -c2 "artifacts/$asset" | grep -q PK; then
                  echo "ok: $asset (from $repo@$tag)"
                  return 0
                fi
              fi
              echo "retry $attempt for $repo@$tag/$asset"
              sleep $((attempt * 10))
            done
            echo "::warning::could not fetch $asset from $repo@$tag — kernel zip is unaffected"
            return 1
          }
          fetch_asset "$BRENE_REPO"   "$BRENE_TAG"   "$BRENE_ASSET"   || true
          fetch_asset "$NOMOUNT_REPO" "$NOMOUNT_TAG" "$NOMOUNT_ASSET" || true

          # extend checksums
          (
            cd artifacts
            for z in "$BRENE_ASSET" "$NOMOUNT_ASSET"; do
              [ -f "$z" ] && sha256sum "$z" >> SHA256SUMS
            done
            sort -u SHA256SUMS -o SHA256SUMS
          )
          ls -la artifacts/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

  release:
    name: Publish release
    needs: build
    if: false  # disabled for testing — re-enable when ready to release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="stormbreaker-${{ github.run_number }}"

          KREL=$(grep kernel.release release-assets/build-info.txt \
                 | cut -d= -f2 || echo "unknown")

          cat > release-notes.md << EOF
          # Stormbreaker Kernel — miatoll

          **Kernel:** \`${KREL}\`
          **Device:** Xiaomi Miatoll (Curtana / Gram / Joyeuse / Excalibur)
          **SoC:** SM6250 (Atoll) — non-GKI kernel v4.14
          **Toolchain:** LLVM/Clang \`${LLVM_VERSION}\` (apt.llvm.org, zero GCC for aarch64)

          ---

          ## ✨ Features

          ### Root & hiding stack
          - **KernelSU** — backslashxx fork \`v3.3.0+72\` (driver 32673), in-tree at
            \`drivers/kernelsu\`, manual hooks (issue #5 rev v2.3) + LSM security hooks;
            kprobe / syscall-table / branch-link hooking disabled
          - **SUSFS v2.3.0** — non-GKI 4.14 semantic port (\`fs/susfs.c\`):
            sus_path, sus_mount, sus_kstat, sus_map, open_redirect, uname/cmdline
            spoofing, avc-log spoofing, kallsyms symbol hiding; userspace ABI
            (\`ksu_susfs\` / BRENE) bridged over the KernelSU reboot supercall
          - **NoMount v2.1.0** — \`fs/nomount\` VFS path redirection / virtual file
            injection with zero mounts (+ upstream post-release evict_inode fix)
          - Companion modules attached: **BRENE** (SUSFS control panel) and the
            **NoMount metamodule** — install both from the manager after flashing

          ### eBPF (extended Berkeley Packet Filter)
          - \`BPF_SYSCALL=y\` — BPF syscall + arm64 JIT (\`BPF_JIT_ALWAYS_ON\`)
          - cgroup-bpf, kprobe / uprobe / tracepoint attach types
          - cls_bpf, act_bpf, lwtunnel BPF, \`NETFILTER_XT_MATCH_BPF\`
          - BPF stream parser (sockmap / sk_msg), BPF events

          ### NTFS support
          - **Legacy NTFS** (\`NTFS_FS=y\`, \`NTFS_RW=y\`) — read + partial write
          - **Paragon NTFS3** read-write driver (\`fs/ntfs3/\`, backported to 4.14)
            - Normal / sparse / compressed files, journal replaying
            - POSIX ACLs, LZX / XPRESS decompression
            - Coexists with legacy driver: \`mount -t ntfs3\`

          ### EROFS (Enhanced Read-Only File System)
          - \`EROFS_FS=y\` with LZ4 compression
          - Extended attributes, POSIX ACL, security labels
          - Mounts system / vendor EROFS partitions natively

          ### BBRv1 congestion control
          - BBR v1 as default TCP congestion control (\`DEFAULT_TCP_CONG="bbr"\`)
          - fq pacing qdisc (\`NET_SCH_FQ=y\`) — mandatory for BBR
          - CUBIC and RENO still compiled in; BBR is the new default

          ### Droidspaces (Linux containers on Android)
          - Full namespace isolation: PID, UTS, IPC, NET, USER
          - cgroup controllers: device, sched, freezer, net_prio, cpuacct, pids, CFS bandwidth, memory
          - seccomp + seccomp filter
          - devtmpfs + auto-mount, overlayfs (volatile mode)
          - Full netfilter stack: conntrack, NAT, nftables, bridge netfilter, VETH
          - IPv6 NAT (NAT66), UFW / fail2ban firewall inside containers
          - Docker-in-container: HUGETLBFS, CHECKPOINT_RESTORE, MACVLAN, VXLAN, INET_DIAG, vsock
          - Cgroup NOPREFIX symlink fix for Droidspaces / LXC compatibility

          ### Kali NetHunter support
          - **USB Gadget (configfs):** HID (BadUSB), CDC ACM, ECM, NCM, RNDIS, Mass Storage, EEM
          - **USB traffic monitoring:** \`USB_MON=y\`
          - **CAN bus:** vcan, slcan, all USB CAN adaptors (EMS, ESD, GS, Kvaser, PEAK, 8DEV, MCBA)
          - **Bluetooth Arsenal:** RFCOMM TTY, BNEP, HIDP, hcibtusb
          - **NFS server + client:** v2 / v3 / v4
          - **mac80211 + external USB Wi-Fi:** ath9k_htc, carl9170, rt2x00 (rt2500usb/rt73usb/rt2800usb), mt7601u, rtl8187, rtl8xxxu, zd1211rw
          - **USB serial:** CH341, FTDI, PL2303, CP210X
          - **SDR:** DVB RTL28XXU

          ### Smooth tuning (baked in, no modules)
          - Touch boost: every input lifts little cores to 1.4 GHz and big
            cores to 1.7 GHz for 120 ms (driver defaults)
          - schedutil: instant up-ramp (500 us), slow decay (20 ms)
          - WALT: capacity margin up 1078 -> 1127 (~5% -> ~10%) — UI tasks
            reach the 2×A76 cluster sooner
          - core_ctl keeps >=1 big core awake; dirty ratios 5/20 (already
            default in this tree)
          - GPU (Adreno 618): boots one power level higher (initial-pwrlevel
            6 -> 5 for speed-bins 0/174)
          - Memory: KSM (auto-run baked in), THP madvise, ZSWAP+lz4 in front
            of zram, idle-page tracking, zram page-cluster 0
          - Storage: CFQ default for legacy queues, mq-deadline auto-default
            for the UFS blk-mq queues, 256 KB read-ahead

          ### Haptics & sound
          - AW8624 vibrator workqueue runs at high priority — faster buzz
            onset on taps/notifications (factory dts calibration untouched)
          - ALSA hrtimer backend enabled (lower-jitter PCM/offload timing)
          - Compress offload + DSP decode, USB audio, dynamic PCM minors,
            force-feedback input all built in

          ### Security fixes
          - **CVE-2025-39764** — Fixed memory leak in nf_conntrack expectation dumpers (pointer+refcount → cookie)
          - **Cgroup NOPREFIX** — symlink fix with proper IS_ERR() error handling

